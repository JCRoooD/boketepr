<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#0a0a0a"/>
  <!-- Sunburst glyph (8 rays + center ring) -->
  <g stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none">
    <line x1="256" y1="96"  x2="256" y2="160"/>
    <line x1="256" y1="352" x2="256" y2="416"/>
    <line x1="96"  y1="256" x2="160" y2="256"/>
    <line x1="352" y1="256" x2="416" y2="256"/>
    <line x1="143" y1="143" x2="188" y2="188"/>
    <line x1="324" y1="324" x2="369" y2="369"/>
    <line x1="143" y1="369" x2="188" y2="324"/>
    <line x1="324" y1="188" x2="369" y2="143"/>
  </g>
  <!-- Center "hoyo" dot -->
  <circle cx="256" cy="256" r="44" fill="none" stroke="#ffffff" stroke-width="20"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
</svg>